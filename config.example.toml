[app]
port = 8080
env = "development"
shutdown_timeout = 10
allowed_origins = ["*"]
# E.164 numbers that receive the operator role on login.
operator_phones = []

[database]
url = "postgres://nusantara:nusantara@localhost:5432/nusantara?sslmode=disable"
max_conns = 5
min_conns = 1
max_conn_lifetime = 30
max_conn_idle_time = 5
trace_enabled = true
trace_include_sql = false
# WARN: trace_include_params leaks passwords/tokens/PII into traces. Keep false in production.
trace_include_params = false
# Maximum length of SQL query text in spans. 0 = no truncation.
trace_max_query_len = 500
# Run goose migrations on startup.
auto_migrate = false

[jwt]
access_secret = "change-me"
refresh_secret = "change-me-too"
access_expiry = 15
refresh_expiry = 43200

[log]
level = "debug"
file_path = "logs/app.log"
max_size = 50
max_backups = 3
max_age = 28

[tracing]
enabled = false
endpoint = "localhost:4317"
service_name = "nusantara-core"

[otp]
# Required in production. HMAC key for OTP hashing.
secret = "change-me-otp"
ttl_seconds = 300
max_attempts = 5
phone_limit = 3
ip_limit = 10
window_minutes = 10
# "log" writes the code to the log (development only).
sender = "log"

[orders]
accept_window_minutes = 10
timezone = "Asia/Jakarta"

[images]
max_bytes = 5242880
max_pixels = 40000000

[storage]
# local | s3
driver = "local"
local_dir = "uploads"
public_base_url = "http://localhost:8080/uploads"
s3_endpoint = ""
s3_bucket = ""
s3_access_key = ""
s3_secret_key = ""

[push]
# log | fcm
driver = "log"
fcm_credentials_file = ""
