services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      CONFIG_FILE: /config/config.toml
    volumes:
      - ./config.toml:/config/config.toml:ro
    # Set database.auto_migrate = true in config.toml to apply the embedded migrations at startup.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nusantara
      POSTGRES_PASSWORD: nusantara
      POSTGRES_DB: nusantara
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nusantara -d nusantara"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
